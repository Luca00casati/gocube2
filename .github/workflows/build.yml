name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The C3 compiler, the version the game is written for.
      - name: Get c3c 0.8.6
        run: |
          Invoke-WebRequest https://github.com/c3lang/c3c/releases/download/v0.8.6/c3-windows.zip -OutFile c3c.zip
          Expand-Archive c3c.zip -DestinationPath $env:RUNNER_TEMP\c3c
          $c3c = Get-ChildItem $env:RUNNER_TEMP\c3c -Recurse -Filter c3c.exe | Select-Object -First 1
          $c3c.DirectoryName | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      # The rendering tests run on WARP (no GPU on the runner); with no sound
      # device, the sound test only checks the mixing.
      - name: Build and test
        run: c3c test
