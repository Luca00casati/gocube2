name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # The build is nob.c: it calls cl, link and fxc directly.
      - name: Build nob
        run: cl nob.c

      # The smoke test runs on WARP (no GPU on the runner); the runner has no
      # Graphics Tools, so the debug layer is skipped there. Unity builds: CI
      # always builds from scratch, where they're fastest.
      - name: Build and test (Debug)
        run: .\nob.exe test debug unity

      - name: Build and test (Release)
        run: .\nob.exe test release unity
